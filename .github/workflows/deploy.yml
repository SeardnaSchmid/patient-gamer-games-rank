# Tests the scoring and publishes the repo root on GitHub Pages. No build step:
# the site is plain HTML/JS/JSON served as-is. The daily run (and a manual one)
# first refreshes games.json from Steam, CheapShark and HowLongToBeat and commits it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh game data
        if: github.event_name != 'push'
        run: |
          node scripts/fetch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || (git commit -m "Refresh game data" && git push)

      - run: node --test score.test.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
