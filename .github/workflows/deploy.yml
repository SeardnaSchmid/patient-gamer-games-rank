# Publishes the site on GitHub Pages. No build step: plain HTML/JS/JSON.
#
# games.json and history.json are not in the repo. The daily run fetches every
# game fresh, seeded with the previous release so a failing source keeps
# yesterday's values, appends today's values to the history carried over from
# that release, and publishes both as a release (data-YYYY-MM-DD) before
# deploying. Pushes and plain manual runs deploy the latest release's data.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fetch:
        description: "Fetch fresh data for every game (about 3.5 h) and release it"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC

permissions:
  contents: write # create the data releases
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  FETCH: ${{ github.event_name == 'schedule' || inputs.fetch == true }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download latest game data
        run: |
          gh release download --pattern games.json
          # Older releases have no history yet; history.mjs then starts one.
          gh release download --pattern history.json || true

      - name: Fetch game data
        if: env.FETCH == 'true'
        env:
          LIMIT: 100000
          REFRESH_DAYS: 0
          MONTHLY_LIMIT: 100000 # runs alongside Steam's rate-limit pause, so all due games fit
          MAX_MINUTES: 300 # stop early and save, leaving room for prices and the release
        run: node scripts/fetch.mjs

      - name: Append to history
        if: env.FETCH == 'true'
        run: node scripts/history.mjs

      # Before the release, so broken data is never published or deployed.
      - run: node --test

      - name: Release game data
        if: env.FETCH == 'true'
        run: |
          day=$(date -u +%F)
          n=$(node -p 'require("./games.json").games.length')
          # A second run on the same day replaces that day's file.
          gh release create "data-$day" games.json history.json --title "Game data $day" \
            --notes "$n games from Steam, SteamSpy, CheapShark and HowLongToBeat, plus the price and rating history of every day so far." \
            || gh release upload "data-$day" games.json history.json --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
